<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO العصرية - نسخة الدكتور</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        #start-screen, #game-screen {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 { margin-bottom: 20px; color: var(--primary-color); }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary-color); }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: var(--secondary-color); }
        .btn-outline { background: #eee; color: #333; }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .cell {
            width: 90px;
            height: 90px;
            background: #fdfdfd;
            border: 2px solid #eee;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background: #fff; border-color: var(--secondary-color); }
        .cell.x { color: var(--primary-color); }
        .cell.o { color: var(--accent-color); }

        .status { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; min-height: 30px; color: var(--text-color); }

        footer {
            background: var(--white);
            width: 100%;
            padding: 15px;
            text-align: center;
            border-top: 4px solid var(--primary-color);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }
        footer p { font-size: 0.95rem; margin: 4px 0; color: #444; }
        .highlight { font-weight: bold; color: var(--primary-color); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>لعبة XO</h1>
            <div class="input-group">
                <label>اسم اللاعب الأول (X):</label>
                <input type="text" id="p1-name" placeholder="مثال: أحمد">
            </div>
            <div class="input-group">
                <label>اسم اللاعب الثاني (O):</label>
                <input type="text" id="p2-name" placeholder="مثال: محمد">
            </div>
            <button class="btn" onclick="startGame(false)">لعب (لاعبين)</button>
            <button class="btn btn-outline" onclick="startGame(true)">لعب ضد الكمبيوتر</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="status" class="status"></div>
            <div class="board" id="board">
                <div class="cell" onclick="handleCellClick(0)"></div>
                <div class="cell" onclick="handleCellClick(1)"></div>
                <div class="cell" onclick="handleCellClick(2)"></div>
                <div class="cell" onclick="handleCellClick(3)"></div>
                <div class="cell" onclick="handleCellClick(4)"></div>
                <div class="cell" onclick="handleCellClick(5)"></div>
                <div class="cell" onclick="handleCellClick(6)"></div>
                <div class="cell" onclick="handleCellClick(7)"></div>
                <div class="cell" onclick="handleCellClick(8)"></div>
            </div>
            <button class="btn" onclick="resetGame()">إعادة المحاولة</button>
            <button class="btn btn-outline" onclick="location.reload()">العودة للرئيسية</button>
        </div>
    </div>

    <footer>
        <p>اسم الطالب: <span class="highlight">فرج عبدالله بن فرج المحمادي</span></p>
        <p>الرقم الجامعي: <span class="highlight">446005636</span></p>
        <p>بإشراف الدكتور: <span class="highlight">محمد أحمد جبلي</span></p>
    </footer>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X"; 
        let isGameActive = true;
        let isVsComputer = false;
        let player1 = "";
        let player2 = "";

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        function startGame(vsAI) {
            player1 = document.getElementById('p1-name').value.trim() || "لاعب 1";
            player2 = vsAI ? "الكمبيوتر" : (document.getElementById('p2-name').value.trim() || "لاعب 2");
            isVsComputer = vsAI;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            resetGame();
        }

        function handleCellClick(index) {
            if (board[index] !== "" || !isGameActive) return;

            executeMove(index);

            if (isGameActive && isVsComputer && currentPlayer === "O") {
                setTimeout(computerMove, 500);
            }
        }

        function executeMove(index) {
            board[index] = currentPlayer;
            cells[index].innerText = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());
            
            if (checkWin()) {
                let winnerName = (currentPlayer === "X") ? player1 : player2;
                statusDisplay.innerText = `مبروك! الفائز هو ${winnerName} (${currentPlayer})`;
                isGameActive = false;
                return;
            }

            if (board.every(cell => cell !== "")) {
                statusDisplay.innerText = "النتيجة: تعادل!";
                isGameActive = false;
                return;
            }

            // تبديل اللاعب بشكل صحيح
            currentPlayer = (currentPlayer === "X") ? "O" : "X";
            updateStatusText();
        }

        function computerMove() {
            let available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (available.length > 0 && isGameActive) {
                let move = available[Math.floor(Math.random() * available.length)];
                executeMove(move);
            }
        }

        function updateStatusText() {
            let currentName = (currentPlayer === "X") ? player1 : player2;
            statusDisplay.innerText = `دور: ${currentName} (${currentPlayer})`;
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(comb => {
                return comb.every(i => board[i] === currentPlayer);
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            cells.forEach(c => {
                c.innerText = "";
                c.classList.remove('x', 'o');
            });
            updateStatusText();
        }
    </script>
</body>
</html>
